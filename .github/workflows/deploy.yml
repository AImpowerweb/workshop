name: Deploy to GitHub Pages

# Builds the site and publishes it whenever main is updated. Also runnable by
# hand from the Actions tab (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:

# Needed for the deploy-pages action to publish and to mint its OIDC token.
permissions:
  contents: read
  pages: write
  id-token: write

# Supersede an in-flight run rather than queueing behind it. Pages allows only
# one deployment at a time and rejects a second with "in progress deployment",
# so letting the older run finish just makes the newer one fail.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      # enablement lets the workflow turn Pages on itself using the job's
      # `pages: write` token, so nobody needs repo-admin rights to flip the
      # switch by hand before the first deploy.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
